<!doctype html>
<html lang="en-AU" data-locale="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/EAIM-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const storedMode = localStorage.getItem("themeMode");
          const legacyDarkMode = localStorage.getItem("darkMode");

          const isValidMode =
            storedMode === "light" ||
            storedMode === "dark" ||
            storedMode === "system";

          let mode = isValidMode ? storedMode : null;

          if (!mode && legacyDarkMode !== null) {
            mode = JSON.parse(legacyDarkMode) ? "dark" : "light";
          }

          if (!mode) {
            mode = "system";
          }

          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = mode === "dark" || (mode === "system" && prefersDark);

          root.classList.toggle("dark", isDark);
          root.dataset.theme = isDark ? "dark" : "light";
          root.style.colorScheme = isDark ? "dark" : "light";

          localStorage.setItem("themeMode", mode);
          localStorage.setItem("darkMode", JSON.stringify(isDark));
        } catch (_) {
          // Ignore and continue with default theme.
        }
      })();
    </script>
    <title>EAIM Job Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
